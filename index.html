<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Lorenzo Hanoto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background-color: #162447;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 350px;
            padding: 30px;
            text-align: center;
            border: 2px solid #e43f5a;
        }
        .avatar {
            width: 100px;
            height: 100px;
            background-color: #e43f5a;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
        }
        h1 {
            margin: 10px 0 5px 0;
            font-size: 24px;
            color: #e43f5a;
        }
        .subtitle {
            font-size: 14px;
            color: #a2a8d3;
            margin-bottom: 20px;
        }
        .info-section {
            text-align: left;
            background: #1f4068;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .info-title {
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            color: #e43f5a;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 15px;
            color: #ffffff;
        }
        .badge {
            background-color: #00b4d8;
            color: #fff;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">LH</div>
        <h1>Lorenzo Hanoto</h1>
        <div class="subtitle">Siswa SMK Tri Ratna</div>

        <div class="info-section">
            <div class="info-title">Pendidikan</div>
            <div class="info-value">Kelas 10 RPL (Rekayasa Perangkat Lunak)</div>
        </div>

        <div class="info-section">
            <div class="info-title">Prestasi Game</div>
            <div class="info-value">Pro Player Blox Fruits <span class="badge">30M Bounty</span></div>
        </div>

        <div class="info-section">
            <div class="info-title">Catatan Khusus</div>
            <div class="info-value">Pernah merusak pintu toilet</div>
        </div>
    </div>

</body>
</html>
